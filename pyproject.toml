[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "facebook-archive-converter"
version = "0.1.0"
description = "Offline conversion of observed legacy Facebook HTML archive layouts"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
facebook-archive-convert = "convert:main"
facebook-archive-coalesce = "coalesce:cli"

[tool.setuptools]
py-modules = ["convert", "coalesce", "formats"]
